<svg xmlns="http://www.w3.org/2000/svg" width="490" height="330" viewBox="0 0 490 330" role="img" aria-labelledby="t d"><title id="t">AI Document &amp; Data Assistant</title><desc id="d">Upload a PDF or CSV and question it in plain language: indexing, retrieval and answers in one interface.</desc><style>
